name: rules pack

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Test the checker
        working-directory: scripts
        run: python -m unittest -v test_check_rules_pack
      - name: Check signal.rules.toml against SIGNAL.md
        run: python scripts/check_rules_pack.py
